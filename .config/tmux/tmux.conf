##### ------------------------------------------------------------
##### Core settings
##### ------------------------------------------------------------

##### Change prefix from Ctrl-b to Ctrl-a.
##### Keep Ctrl-a pass-through available via the prefix for shell shortcuts such as line start.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 100000
set -sg escape-time 10
set -g display-time 2000
set -g display-panes-time 2000

set -g mouse on
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB,ghostty:RGB,wezterm:RGB,alacritty:RGB,kitty:RGB"

setw -g mode-keys vi
set -g status-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g focus-events on
set -g set-clipboard on

##### ------------------------------------------------------------
##### Color palette (terminal background + Tokyo Night accents)
##### ------------------------------------------------------------

##### Use the terminal app's own background, transparency, and blur.
##### This also lets non-Ghostty terminals pass their default background through tmux.
%hidden BG="default"
##### tmux's confirm-before prompt (message-command-style) ignores "bg=default"
##### in inline #[] overrides, unlike display-message -- an explicit hex is the
##### only way to taper an arrow there. Keep this in sync with config.ghostty's
##### "background" value; it only matters for the kill confirmations below.
%hidden CONFIRM_BG="#010409"
%hidden FG="#a9b1d6"
%hidden ACCENT_FG="#1a1b26"
%hidden DIM="#565f89"
%hidden SEP="#414868"
%hidden WHITE="#dddddd"
%hidden BLUE="#7aa2f7"
%hidden PURPLE="#bb9af7"
%hidden GREEN="#9ece6a"
%hidden YELLOW="#e0af68"
%hidden RED="#f7768e"

##### ------------------------------------------------------------
##### Status bar (Powerline-style arrow separators)
##### ------------------------------------------------------------

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=$FG,bg=$BG"

set -g status-left-length 60
set -g status-right-length 160

##### Left: state indicator, closed with a Powerline-style arrow (▶).
##### Uses the standard Unicode Geometric Shapes triangle (U+25B6), not a
##### Nerd Font Private Use Area glyph -- renders correctly in any monospace
##### font, no Nerd Font install required (the PUA arrow used to fall back
##### to near-invisible tofu on terminals without one).
##### Show one state by priority to avoid overlap:
##### prefix active (red) "Mode: Prefix" > sync active (yellow) "Sync: ON" > copy mode (green) "Mode: Visual" > normal (blue) "Session: name"
set -g status-left "\
#[fg=$ACCENT_FG,bg=#{?client_prefix,$RED,#{?pane_synchronized,$YELLOW,#{?pane_in_mode,$GREEN,$BLUE}}},bold]\
#{?client_prefix, Mode: Prefix ,#{?pane_synchronized, Sync: ON ,#{?pane_in_mode, Mode: Visual ,  Session: #S }}}\
#[fg=#{?client_prefix,$RED,#{?pane_synchronized,$YELLOW,#{?pane_in_mode,$GREEN,$BLUE}}},bg=$BG,nobold]▶#[default] "

##### Center: window list (number:name). Highlight the current window background.
##### AI表示: その window のいずれかの pane でClaude Codeが応答中のとき、
##### window optionの @ai_thinking を見て緑文字ハイライトのbrailleスピナー
##### （@ai_spinner_frameをそのまま表示するだけ。#(...)job経由にしないのは、
##### tmux(1)に明記された「#()jobの出力がどれだけ速く更新されても、status line
##### 自体は1秒に1回までしか再描画されない」というハード制限を踏むため。代わりに
##### ai_thinking.shが常駐ループでset-option→refresh-client -Sを直接叩いて
##### 明示的に再描画を強制し、真に滑らかに回す）を前置きする。矢印separatorは
##### 付けない（AI表示用にわざわざ挟むと見づらいとの判断）。
##### @ai_thinkingはai_thinking.shがClaude Codeのhookから立てる/消す。Stopフックは
##### ユーザーの中断（Escape等）では発火しない既知の制約があるため、同じ常駐ループが
##### PostToolUseの心拍を見て一定時間途絶えたら自動でオフにする
##### （詳細はai_thinking.sh参照）。
##### 注意: #{?cond,true,false} は #[] 内のカンマ区切り属性(fg=..,bold等)もそのまま
##### 引数区切りとして数えてしまい、真偽分岐が崩れる。そのため分岐の中では #[] を
##### 属性ごとに複数個に分けて書く（カンマを使わない）。
##### Claude Codeは自身のプロセス名をバージョン文字列（例: "2.1.219"）に
##### 書き換えているため、automatic-renameが#Wにそのままそれを表示してしまう。
##### pane_current_commandが数字.数字.数字だけの場合は"claude"に読み替える。
setw -g automatic-rename-format "#{?pane_in_mode,[tmux],#{s/^[0-9]+\.[0-9]+\.[0-9]+$/claude/:#{pane_current_command}}}#{?pane_dead,[dead],}"

setw -g window-status-format "#[fg=$WHITE,bg=$BG] ▷ #{?@ai_thinking,#[fg=$GREEN]#[bold] #{@ai_spinner_frame} #[fg=$FG]#[nobold],}#[fg=$FG]#I:#W  "
setw -g window-status-current-format "#[fg=$ACCENT_FG,bg=$BLUE,bold]  #{?@ai_thinking,#[fg=$GREEN] #{@ai_spinner_frame} #[fg=$ACCENT_FG],}#I:#W  #[fg=$BLUE,bg=$BG,nobold]▶"
setw -g window-status-separator ""

##### Right: full labels plus values, divided by "/" separators.
##### Match the terminal app's default background, and distinguish sections by label color.
##### Network=Purple, CPU=Green, Memory=Red, Battery=Yellow, Date/Time=Blue.
##### CPU/Memory show a percentage, colored green/yellow/red by load (see
##### cpu.sh / mem.sh). Reset to $FG before each value so colors from the
##### previous script output do not leak.
set -g status-right "\
#[fg=$WHITE,bg=$BG]/ #[fg=$PURPLE,bold]Network #[fg=$FG,nobold]#(~/.config/tmux/net_speed.sh) \
#[fg=$WHITE]/ #[fg=$GREEN,bold]CPU #[fg=$FG,nobold]#(~/.config/tmux/cpu.sh) \
#[fg=$WHITE]/ #[fg=$RED,bold]Memory #[fg=$FG,nobold]#(~/.config/tmux/mem.sh) \
#[fg=$WHITE]/ #[fg=$YELLOW,bold]Battery #[fg=$FG,nobold]#(~/.config/tmux/battery.sh) \
#[fg=$WHITE]/ #[fg=$BLUE,bold]%m/%d(%a) %H:%M "

##### ------------------------------------------------------------
##### Pane UI
##### ------------------------------------------------------------

# Border labels: pane number plus current command. The active pane border turns blue.
set -g pane-border-status top
set -g pane-border-format " #P #{pane_current_command} "
set -g pane-border-style "fg=$SEP"
set -g pane-active-border-style "fg=$BLUE,bold"

# Dim inactive panes by text color only, while keeping the terminal background.
setw -g window-style "fg=$DIM,bg=$BG"
setw -g window-active-style "fg=$FG,bg=$BG"

# Pane number display shown by prefix q.
set -g display-panes-active-colour "$BLUE"
set -g display-panes-colour "$DIM"

# Message and mode colors. message-command-style matches message-style so the
# kill-confirmation prompts below can use the same $YELLOW arrow taper.
set -g message-style "fg=$ACCENT_FG,bg=$YELLOW,bold"
set -g message-command-style "fg=$ACCENT_FG,bg=$YELLOW,bold"
set -g mode-style "fg=$ACCENT_FG,bg=$BLUE"

##### ------------------------------------------------------------
##### Split commands (inherit current path)
##### ------------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C new-session -c "#{pane_current_path}"

##### ------------------------------------------------------------
##### Pane movement (vim-style, repeatable with -r)
##### ------------------------------------------------------------

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### Also allow Ctrl-h/j/k/l through prefix while holding Ctrl.
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

##### ------------------------------------------------------------
##### Window switching
##### ------------------------------------------------------------
# prefix + n / p : next / previous window, repeatable with -r.
# prefix + 0-9   : switch directly by window number using tmux defaults.

bind -r n next-window
bind -r p previous-window

##### Also allow Ctrl-n/p through prefix while holding Ctrl.
bind -r C-n next-window
bind -r C-p previous-window

# 直前にいたウィンドウへトグルで戻る（MRU切り替え）。
bind Tab last-window

##### ------------------------------------------------------------
##### Resize (repeatable with -r)
##### ------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Equalize layout / toggle zoom.
bind = select-layout tiled
bind Enter resize-pane -Z

##### ------------------------------------------------------------
##### Utilities
##### ------------------------------------------------------------

# Broadcast toggle: send input to all panes.
# The trailing #[fg=$YELLOW,bg=$BG] tapers the message-style background into
# the terminal background, the same Powerline arrow effect used elsewhere.
bind b setw synchronize-panes \; display-message "sync: #{?pane_synchronized,ON,OFF} #[fg=$YELLOW,bg=$BG,nobold]▶"

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded ✔ #[fg=$YELLOW,bg=$BG,nobold]▶"

# Kill confirmations (override tmux defaults to add the same tapered arrow).
# message-command-style is set to match message-style above, so the same
# $YELLOW taper works here too.
bind x confirm-before -p "kill-pane #P? (y/n) #[fg=$YELLOW,bg=$CONFIRM_BG,nobold]▶" kill-pane
bind & confirm-before -p "kill-window #W? (y/n) #[fg=$YELLOW,bg=$CONFIRM_BG,nobold]▶" kill-window
