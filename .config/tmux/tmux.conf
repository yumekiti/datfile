##### ------------------------------------------------------------
##### 基本設定
##### ------------------------------------------------------------

##### prefixキーをCtrl-bからCtrl-aへ変更（小指を伸ばさず届く位置。screen由来の定番）
##### 元のCtrl-bを叩いてしまった時のために、Ctrl-a単独入力（行頭移動など）はprefix経由で送れるようにしてある
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g history-limit 100000
set -sg escape-time 10
set -g display-time 2000
set -g display-panes-time 2000

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

setw -g mode-keys vi
set -g status-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g focus-events on
set -g set-clipboard on

##### ------------------------------------------------------------
##### カラーパレット（Tokyo Night）
##### ------------------------------------------------------------

%hidden BG="#1a1b26"
%hidden FG="#a9b1d6"
%hidden DIM="#565f89"
%hidden SEP="#414868"
%hidden BLUE="#7aa2f7"
%hidden CYAN="#7dcfff"
%hidden PURPLE="#bb9af7"
%hidden GREEN="#9ece6a"
%hidden YELLOW="#e0af68"
%hidden RED="#f7768e"

##### ------------------------------------------------------------
##### ステータスバー（背景1色のシンプル表示）
##### ------------------------------------------------------------

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=$FG,bg=$BG"

set -g status-left-length 60
set -g status-right-length 160

##### 左：状態表示。右側と同じ「ラベル: 値」の形式に揃えてある
##### 優先順位をつけて1つだけ表示（重ならないように）：
##### prefix中（赤）"Mode: Prefix" > sync中（黄）"Sync: ON" > コピーモード中（緑）"Mode: Visual" > 通常時（青）"Session: 名前"
set -g status-left "\
#[fg=$BG,bg=#{?client_prefix,$RED,#{?pane_synchronized,$YELLOW,#{?pane_in_mode,$GREEN,$BLUE}}},bold]\
#{?client_prefix, Mode: Prefix ,#{?pane_synchronized, Sync: ON ,#{?pane_in_mode, Mode: Visual ,  Session: #S }}}\
#[fg=#{?client_prefix,$RED,#{?pane_synchronized,$YELLOW,#{?pane_in_mode,$GREEN,$BLUE}}},bg=$BG,nobold]#[default] "

##### 中央：window一覧（番号:名前）。今いるwindowだけ背景色を付けて一目で分かるようにする
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=$BG,bg=$BLUE,bold] #I:#W #[fg=$BLUE,bg=$BG,nobold]"
setw -g window-status-separator ""

##### 右：略さない単語ラベル＋値。絵文字・特殊フォント記号は使わない（色だけにも頼らない）
##### 背景はSEP1色に統一し、文字色だけで区別（ブロックごとの色切り替えをやめて見た目をシンプルに）
set -g status-right "\
#[fg=$SEP,bg=$BG]#[fg=$FG,bg=$SEP] Network #(~/.config/tmux/net_speed.sh) \
CPU #(~/.config/tmux/cpu.sh) \
Battery #(~/.config/tmux/battery.sh) \
#[fg=$BLUE,bold]%H:%M \
#[fg=$CYAN,nobold]%m/%d(%a) "

##### ------------------------------------------------------------
##### Pane UI
##### ------------------------------------------------------------

# border（常時ラベル表示：番号＋実行中コマンド。アクティブpaneは境界が青くなるので今いる場所が一目で分かる）
set -g pane-border-status top
set -g pane-border-format " #P #{pane_current_command} "
set -g pane-border-style "fg=$SEP"
set -g pane-active-border-style "fg=$BLUE,bold"

# 非アクティブpaneをわずかに暗く（アクティブを際立たせる）
setw -g window-style "fg=$DIM,bg=#16161e"
setw -g window-active-style "fg=$FG,bg=$BG"

# pane番号表示（prefix q）を大きく見やすく
set -g display-panes-active-colour "$BLUE"
set -g display-panes-colour "$DIM"

# メッセージ/モードの配色
set -g message-style "fg=$BG,bg=$YELLOW,bold"
set -g mode-style "fg=$BG,bg=$BLUE"

##### ------------------------------------------------------------
##### 分割操作（現在のパスを引き継ぐ）
##### ------------------------------------------------------------

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

##### ------------------------------------------------------------
##### pane移動（vim風、-rで連続入力可）
##### ------------------------------------------------------------

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

##### prefix経由でCtrl押しっぱなしのh/j/k/lでも移動できるように（例: Ctrl-a を離さず h）
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

##### ------------------------------------------------------------
##### ウィンドウ切替
##### ------------------------------------------------------------
# prefix + n / p : 次 / 前のウィンドウへ（-r指定なので連続で押せる）
# prefix + 0〜9  : 番号でウィンドウへ直接切り替え（tmux標準機能）

bind -r n next-window
bind -r p previous-window

##### prefix経由でCtrl押しっぱなしのn/pでも切り替えられるように（例: Ctrl-a を離さず n）
bind -r C-n next-window
bind -r C-p previous-window

##### ------------------------------------------------------------
##### リサイズ（-r で連続入力可）
##### ------------------------------------------------------------

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# レイアウトを均等化 / 全画面トグル
bind = select-layout tiled
bind Enter resize-pane -Z

##### ------------------------------------------------------------
##### コピーモード（vim風 + macOSクリップボード連携）
##### ------------------------------------------------------------

bind Escape copy-mode
bind-key -T copy-mode-vi v     send -X begin-selection
bind-key -T copy-mode-vi C-v   send -X rectangle-toggle
bind-key -T copy-mode-vi V     send -X select-line
bind-key -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ペースト
bind p paste-buffer
bind -n MouseDown3Pane paste-buffer

##### ------------------------------------------------------------
##### 便利系
##### ------------------------------------------------------------

# broadcast toggle（全pane同時入力）
bind b setw synchronize-panes \; display-message "sync: #{?pane_synchronized,ON,OFF}"

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded ✔"
